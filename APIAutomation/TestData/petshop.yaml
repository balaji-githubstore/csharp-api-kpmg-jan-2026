openapi: 3.0.3
info:
  title: Petstore API
  version: 1.0.0
  description: API to get a pet by its ID

servers:
  - url: https://petstore.swagger.io/v2

paths:
  # Get - pet by id
  /pet/{petId}:
    get:
      summary: Find pet by ID
      operationId: getPetById
      tags:
        - pet
      parameters:
        - name: petId
          in: path
          description: ID of the pet to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Pet found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetNotFound'

  /pet/findByStatus:
    get:
      summary: Find pet by status
      operationId: findPetsByStatus
      tags:
        - pet
      parameters:
        - name: status
          in: query
          description: status
          required: true
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
      responses:
        '200':
          description: Pet found
          content:
            application/json:
              schema:
                type: array
#                minItems: 1
                items:
                  $ref: '#/components/schemas/Pet'

  # Add
  /pet:
    post:
      summary: Add a new pet to the store
      operationId: addPet
      tags:
        - pet
      requestBody:
        description: Pet object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Pet added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input

    # update
    put:
      summary: Update an existing pet
      operationId: updatePet
      tags:
        - pet
      requestBody:
        description: Pet object that needs to be updated in the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Pet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
        '405':
          description: Validation exception

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Pet:
      type: object
      required:
        - name
        - photoUrls
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
            - string
    PetNotFound:
      type: object
      required:
        - code
        - type
        - message
      properties:
        code:
          type: integer
        type:
          type: string
        message:
          type: string



